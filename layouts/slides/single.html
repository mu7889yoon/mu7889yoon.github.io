{{ define "main" }}
  <article class="post">
    <header class="post-header">
      <h1 class="post-title">{{ .Title }}</h1>
      {{ with .Params.event }}<p>{{ . }}</p>{{ end }}
    </header>
    <div class="post-content">
      {{ .Content }}
      {{ with .Params.slide_url }}
        <iframe
          src="{{ . }}"
          style="width: 100%; aspect-ratio: 16/9; border: none;"
          allowfullscreen
        ></iframe>
      {{ end }}
    </div>
  </article>
{{ end }}
