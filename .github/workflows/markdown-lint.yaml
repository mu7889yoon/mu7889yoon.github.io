name: Markdown Lint
on:
  push:
    branches:
      - main
    paths:
      - 'content/**/*.md'
  pull_request:
    paths:
      - 'content/**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2

      - name: Run markdownlint and fix
        run: markdownlint-cli2 --fix "content/**/*.md" || true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'style: fix markdown lint errors'
          file_pattern: 'content/**/*.md'
